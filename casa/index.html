<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Casa</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#09392B" />
<link rel="icon" href="icons/favicon-32.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Casa" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
  :root {
    --dark: #09392B;
    --paper-2: #051F17;
    --surface: #0E4433;
    --line: #1B5A45;
    --light: #FDF9F0;
    --accent: #A8F16C;
    --muted: #9ec9b5;
    --faint: #6f9484;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    min-height: 100dvh;
    background: linear-gradient(180deg, #12513D 0%, #0C4232 45%, #051F17 100%);
    color: var(--light);
    font-family: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: max(24px, env(safe-area-inset-top)) 24px 12px;
  }
  header img {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: block;
  }
  header .wordmark {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 600;
    font-size: 1.3rem;
  }
  main {
    flex: 1;
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding: 20px 20px calc(40px + env(safe-area-inset-bottom));
  }
  .section-label {
    font-family: "Space Grotesk", sans-serif;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 18px 2px 10px;
  }
  .card-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  a.card, div.card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    text-decoration: none;
    color: var(--light);
  }
  a.card:active { background: #115a44; }
  .card .icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: var(--accent);
    color: var(--dark);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    flex-shrink: 0;
  }
  .card.disabled .icon {
    background: #2a3d35;
    color: var(--faint);
  }
  .card .body { flex: 1; min-width: 0; }
  .card .title { font-weight: 600; font-size: 1rem; }
  .card .subtitle { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }
  .card.disabled { opacity: 0.55; }
  .card.disabled .subtitle { color: var(--faint); }
  .card .chev { color: var(--muted); font-size: 1.1rem; flex-shrink: 0; }
  .badge {
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    background: #2a3d35;
    color: var(--faint);
    padding: 3px 8px;
    border-radius: 999px;
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <header>
    <img src="icons/icon-192.png" alt="Casa" />
    <span class="wordmark">Casa</span>
  </header>

  <main>
    <p class="section-label">Gastos</p>
    <div class="card-list">
      <a class="card" href="https://script.google.com/macros/s/AKfycbza1CoFVROOTkQknWEcxHCKXZHqG1axDkbxl2i3gnPMxvAkodY9XnRgw7wo3o7LWI1M5A/exec">
        <div class="icon">＋</div>
        <div class="body">
          <div class="title">Registrar gasto</div>
          <div class="subtitle">Agregar un nuevo gasto de la familia</div>
        </div>
        <div class="chev">&rsaquo;</div>
      </a>

      <div class="card disabled">
        <div class="icon">📊</div>
        <div class="body">
          <div class="title">Ver estado de gastos</div>
          <div class="subtitle">Resumen y balance del mes</div>
        </div>
        <div class="badge">Pronto</div>
      </div>
    </div>
  </main>
</body>
</html>
